services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      APP_NAME: ${APP_NAME:-standalone-test-laboratory}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: api-service
      HOST: 0.0.0.0
      PORT: 8080
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-test_lab}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in test-app/.env}@postgres:5432/${POSTGRES_DB:-test_lab}
      REDIS_URL: redis://redis:6379/0
      WORKER_ENABLED: "false"
      MAX_CPU_WORK_MS: ${MAX_CPU_WORK_MS:-1000}
      MAX_LATENCY_MS: ${MAX_LATENCY_MS:-1000}
      MAX_MEMORY_MB: ${MAX_MEMORY_MB:-32}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "worker.main"]
    environment:
      APP_NAME: ${APP_NAME:-standalone-test-laboratory}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: worker-service
      DATABASE_URL: postgresql://${POSTGRES_USER:-test_lab}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in test-app/.env}@postgres:5432/${POSTGRES_DB:-test_lab}
      REDIS_URL: redis://redis:6379/0
      WORKER_ENABLED: "true"
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-10}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-9101}
    ports:
      - "127.0.0.1:9101:9101"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-test_lab}
      POSTGRES_USER: ${POSTGRES_USER:-test_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in test-app/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
